name: Build 26.3

on:
  push:
    branches: [ "mc26.3-port" ]
  pull_request:
    branches: [ "1.21" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immersive-portals-26.3-build
          path: build/libs/*.jar
          if-no-files-found: warn
