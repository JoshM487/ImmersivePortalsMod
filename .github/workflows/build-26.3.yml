name: Build 26.3

on:
  push:
    branches: [ "mc26.3-port", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port patches
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Clone modern 26.2 source baseline
        run: git clone --depth 1 --branch mc-26.2-main https://github.com/fmpapierz/SeamlessPortals.git upstream

      - name: Apply 26.3 port patches
        run: python3 .github/scripts/port_26_3.py upstream

      - name: Fix 26.3 ShaderManager mixin target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/common/src/main/java/com/warwa/seamlessportals/mixin/client/ShaderManagerCompilationCacheMixin.java")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '@Mixin(targets = "net/minecraft/client/renderer/ShaderManager$CompilationCache")',
              '@Mixin(targets = "net/minecraft/client/renderer/ShaderManager$Configs")'
          )
          s = s.replace(
              'method = "getShaderSource(Lnet/minecraft/resources/Identifier;Lcom/mojang/blaze3d/shaders/ShaderType;)Ljava/lang/String;"',
              'method = "getShader(Lnet/minecraft/resources/Identifier;Lcom/mojang/renderpearl/api/pipeline/ShaderType;)Ljava/lang/String;"'
          )
          if 'ShaderManager$CompilationCache' in s or 'getShaderSource(' in s:
              raise SystemExit("old 26.2 ShaderManager mixin target survived")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric 26.3
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :fabric:build --stacktrace --console=plain

      - name: Upload production jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-26.3-build
          path: |
            upstream/fabric/build/libs/*.jar
          if-no-files-found: warn
