name: Build 26.3

on:
  push:
    branches: [ "mc26.3-port", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port patches
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Clone modern 26.2 source baseline
        run: git clone --depth 1 --branch mc-26.2-main https://github.com/fmpapierz/SeamlessPortals.git upstream

      - name: Apply 26.3 port patches
        run: python3 .github/scripts/port_26_3.py upstream

      - name: Fix 26.3 runtime mixin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ShaderManager$CompilationCache became ShaderManager$Configs in 26.3.
          p = Path("upstream/common/src/main/java/com/warwa/seamlessportals/mixin/client/ShaderManagerCompilationCacheMixin.java")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '@Mixin(targets = "net/minecraft/client/renderer/ShaderManager$CompilationCache")',
              '@Mixin(targets = "net/minecraft/client/renderer/ShaderManager$Configs")'
          )
          s = re.sub(
              r'method = "getShaderSource\(Lnet/minecraft/resources/Identifier;Lcom/mojang/(?:blaze3d/shaders|renderpearl/api/pipeline)/ShaderType;\)Ljava/lang/String;"',
              'method = "getShader(Lnet/minecraft/resources/Identifier;Lcom/mojang/renderpearl/api/pipeline/ShaderType;)Ljava/lang/String;"',
              s
          )
          p.write_text(s, encoding="utf-8")

          # InterpolationHandler became an interface. LivingEntity now uses
          # SteppedInterpolationHandler, whose shared implementation lives in
          # AbstractInterpolationHandler.
          p = Path("upstream/common/src/main/java/qouteall/imm_ptl/core/mixin/client/MixinLivingEntity_C.java")
          p.write_text(r'''package qouteall.imm_ptl.core.mixin.client;

          import net.minecraft.world.entity.AbstractInterpolationHandler;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.PositionPath;
          import net.minecraft.world.phys.Vec3;
          import org.spongepowered.asm.mixin.Final;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Shadow;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;
          import qouteall.imm_ptl.core.IPGlobal;
          import qouteall.imm_ptl.core.McHelper;
          import qouteall.imm_ptl.core.ducks.IEEntity;
          import qouteall.imm_ptl.core.portal.Portal;

          @Mixin(AbstractInterpolationHandler.class)
          public abstract class MixinLivingEntity_C {
              @Shadow
              @Final
              protected Entity entity;

              @Inject(
                  method = "interpolateTo(Lnet/minecraft/world/entity/PositionPath;FFZ)Z",
                  at = @At("RETURN")
              )
              private void onUpdateTrackedPositionAndAngles(
                  PositionPath position,
                  float yaw,
                  float pitch,
                  boolean hasRotation,
                  CallbackInfoReturnable<Boolean> cir
              ) {
                  Entity this_ = entity;
                  Vec3 targetPos = position != null ? position.endPosition() : this_.position();

                  if (!IPGlobal.allowClientEntityPosInterpolation) {
                      this_.setPos(targetPos);
                      return;
                  }

                  Portal collidingPortal = ((IEEntity) this_).ip_getCollidingPortal();
                  if (collidingPortal != null) {
                      double dx = this_.getX() - targetPos.x;
                      double dy = this_.getY() - targetPos.y;
                      double dz = this_.getZ() - targetPos.z;
                      if (dx * dx + dy * dy + dz * dz > 4) {
                          McHelper.setPosAndLastTickPos(
                              this_,
                              targetPos,
                              targetPos.subtract(McHelper.getWorldVelocity(this_))
                          );
                          McHelper.updateBoundingBox(this_);
                      }
                  }
              }
          }
          ''', encoding="utf-8")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric 26.3
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :fabric:build --stacktrace --console=plain

      - name: Install headless client runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri

      - name: Runtime client smoke test
        working-directory: upstream
        run: |
          set -uo pipefail
          rm -f client-smoke.log
          set +e
          timeout --signal=TERM 120s xvfb-run -a ./gradlew :fabric:runClient --stacktrace --console=plain 2>&1 | tee client-smoke.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -Eq 'MixinApplyError|InvalidMixinException|Mixin transformation .* failed|Exception in thread "main"|Could not execute entrypoint|org\.spongepowered\.asm\.mixin\.throwables' client-smoke.log; then
            echo "Runtime smoke detected a Mixin/bootstrap crash."
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 143 ]; then
            echo "Client exited unexpectedly with status $status"
            exit "$status"
          fi

          if ! grep -Eq '\[Render thread/INFO\]|Render thread' client-smoke.log; then
            echo "Client never reached the render thread."
            exit 1
          fi

          echo "Client reached normal render-thread startup without a Mixin/bootstrap crash."

      - name: Portal crossing gametest
        working-directory: upstream
        run: |
          set -o pipefail
          timeout --signal=TERM 360s xvfb-run -a ./gradlew :fabric:runCrossingGametest -PdisableAperturePassthrough=true --stacktrace --console=plain 2>&1 | tee crossing-smoke.log
          grep -F "[CROSSING SMOKE] ALL LEGS PASS" crossing-smoke.log

      - name: Upload production jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-26.3-build
          path: |
            upstream/fabric/build/libs/*.jar
          if-no-files-found: warn
